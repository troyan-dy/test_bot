name: lint

on:
  push:
    branches: [master]
  pull_request:

jobs:
  wps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - run: flake8 app --select=WPS
